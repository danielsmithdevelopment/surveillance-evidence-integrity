name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  challenge-tool:
    name: challenge-tool (lint · a11y · lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: challenge-tool

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: challenge-tool/package-lock.json

      - name: Install
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint (incl. jsx-a11y strict)
        run: npm run lint

      - name: Unit smoke tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: WCAG axe (Playwright)
        run: npm run test:a11y

      - name: Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            challenge-tool/.lighthouseci
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: challenge-tool/playwright-report
          retention-days: 14
