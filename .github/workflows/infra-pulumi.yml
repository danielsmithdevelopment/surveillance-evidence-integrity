name: Infra (Pulumi)

# Applies Cloudflare KV / R2 / optional routes via Pulumi.
# Worker script + assets still deploy with Wrangler (not this workflow).

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-pulumi.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-pulumi.yml"
  workflow_dispatch:
    inputs:
      command:
        description: Pulumi command
        type: choice
        options:
          - preview
          - up
        default: up

concurrency:
  group: infra-pulumi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pulumi:
    name: pulumi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PULUMI_STACK: ${{ vars.PULUMI_STACK || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard secrets
        run: |
          missing=
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -z "$PULUMI_ACCESS_TOKEN" ] && missing="${missing} PULUMI_ACCESS_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="${missing} CLOUDFLARE_ACCOUNT_ID (repo variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets/vars:$missing"
            echo "See infra/README.md → GitHub Actions"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install npm deps
        run: npm ci

      - name: Setup Pulumi
        uses: pulumi/setup-pulumi@v2

      - name: Resolve command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "command=preview" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "command=${{ inputs.command }}" >> "$GITHUB_OUTPUT"
          else
            echo "command=up" >> "$GITHUB_OUTPUT"
          fi

      - name: Stack select + config
        run: |
          pulumi stack select "$PULUMI_STACK" --create
          pulumi config set accountId "$CLOUDFLARE_ACCOUNT_ID"
          pulumi config set workerName challenge-the-footage
          pulumi config set domain "${{ vars.CTF_DOMAIN || 'challengethefootage.com' }}"
          pulumi config set enableR2 "${{ vars.PULUMI_ENABLE_R2 || 'true' }}"
          if [ -n "${{ vars.CLOUDFLARE_ZONE_ID }}" ]; then
            pulumi config set zoneId "${{ vars.CLOUDFLARE_ZONE_ID }}"
          fi
          if [ "${{ vars.PULUMI_ENABLE_ROUTES }}" = "true" ]; then
            pulumi config set enableRoutes true
          else
            pulumi config set enableRoutes false
          fi

      - name: Pulumi preview
        if: steps.cmd.outputs.command == 'preview'
        uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: ${{ env.PULUMI_STACK }}
          work-dir: infra
          comment-on-pr: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cloud-url: https://api.pulumi.com
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Pulumi up
        if: steps.cmd.outputs.command == 'up'
        uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ env.PULUMI_STACK }}
          work-dir: infra
          upsert: true
          cloud-url: https://api.pulumi.com
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync wrangler.toml bindings
        if: steps.cmd.outputs.command == 'up'
        run: npm run sync
        env:
          STACK: ${{ env.PULUMI_STACK }}

      - name: Commit binding sync
        if: >
          steps.cmd.outputs.command == 'up' &&
          github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge-tool/wrangler.toml
          if git diff --staged --quiet; then
            echo "No wrangler.toml changes"
            exit 0
          fi
          git commit -m "chore: sync wrangler bindings from Pulumi (${PULUMI_STACK})"
          git push
