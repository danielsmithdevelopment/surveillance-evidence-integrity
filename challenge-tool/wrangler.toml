# Production deploy walkthrough: CLOUDFLARE-DEPLOY.md
name = "challenge-the-footage"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Serve static assets (index.html, terms, evidence, public-defenders) alongside the Worker.
# run_worker_first so Link headers, Markdown negotiation, GIS client-id inject, and /api/*
# always hit worker.js.
[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = true

# Optional custom domain (uncomment after the zone is on Cloudflare):
# routes = [
#   { pattern = "challengethefootage.com/*", zone_name = "challengethefootage.com" },
#   { pattern = "www.challengethefootage.com/*", zone_name = "challengethefootage.com" }
# ]

# Prefer R2 binding for evidence blobs in production (see CLOUDFLARE-DEPLOY.md).
# [[r2_buckets]]
# binding = "EVIDENCE_BUCKET"
# bucket_name = "ctf-evidence"
# preview_bucket_name = "ctf-evidence-preview"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"
preview_id = "REPLACE_WITH_RATE_LIMIT_KV_PREVIEW_ID"

# Secrets (wrangler secret put) — never commit; never set ALLOW_TEST_AUTH in production:
#   GOOGLE_CLIENT_ID
#   CLAWQL_GATEWAY_URL
#   CLAWQL_API_KEY
#   R2_ACCOUNT_ID          (only if not using EVIDENCE_BUCKET binding)
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET_NAME

[vars]
# Non-secret defaults. Do not set ALLOW_TEST_AUTH or GENERATION_MODE=offline here for prod.
TOOL_NAME = "Challenge the Footage"
