name = "challenge-the-footage"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Serve static assets (index.html, terms, evidence, public-defenders) alongside the Worker.
# run_worker_first so Link headers, Markdown negotiation, and /api/* always hit worker.js.
[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = true

# Optional R2 binding for evidence blobs (prefer this in production).
# [[r2_buckets]]
# binding = "EVIDENCE_BUCKET"
# bucket_name = "ctf-evidence"
# preview_bucket_name = "ctf-evidence-preview"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"
preview_id = "REPLACE_WITH_RATE_LIMIT_KV_PREVIEW_ID"

# Secrets (wrangler secret put):
#   GOOGLE_CLIENT_ID
#   CLAWQL_GATEWAY_URL
#   CLAWQL_API_KEY
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET_NAME

[vars]
# Non-secret defaults
TOOL_NAME = "Challenge the Footage"
