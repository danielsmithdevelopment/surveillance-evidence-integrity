name = "witness-api"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = true

[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "REPLACE_WITH_SESSIONS_KV_ID"
preview_id = "REPLACE_WITH_SESSIONS_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "DEVICE_REGISTRY_KV"
id = "REPLACE_WITH_DEVICE_REGISTRY_KV_ID"
preview_id = "REPLACE_WITH_DEVICE_REGISTRY_KV_PREVIEW_ID"

# Secrets:
#   CLAWQL_GATEWAY_URL
#   CLAWQL_API_KEY
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET_NAME
